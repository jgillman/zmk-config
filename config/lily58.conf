# Sleep after 15 min idle (any key wakes it); halves save battery.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Left half reports the right half's battery to the computer, too.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Max BLE TX power (+8 dBm) for a steadier link between halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
